<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Timm Hofmann – Fullstack Software Engineer &amp; Cloud Architect">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a838" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#e8a838" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#e8a838" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a838"/>
      <stop offset="1" stop-color="#e8a838" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f2ede6" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="16" fill="#0d0d0d"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glow)"/>

  <g font-family="'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="92" fill="#e8a838" font-size="30" letter-spacing="10">timm</text>
    <text x="58" y="196" fill="#f2ede6" font-size="124" font-weight="800" letter-spacing="-1">HOFMANN</text>
  </g>

  <rect x="64" y="222" width="110" height="2" fill="url(#line)"/>
  <circle cx="186" cy="223" r="3" fill="#e8a838" fill-opacity="0.7"/>

  <text x="64" y="264" fill="#9a9590" font-family="'DM Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="2.5">FULLSTACK SOFTWARE ENGINEER &amp; CLOUD ARCHITECT</text>

  <g font-family="'JetBrains Mono', SFMono-Regular, Consolas, Menlo, monospace" font-size="13" fill="#5a5550" letter-spacing="2">
    <text x="1136" y="64" text-anchor="end">JAVA · KOTLIN · SPRING · ANGULAR</text>
    <text x="1136" y="88" text-anchor="end">KUBERNETES · AZURE · DEVOPS</text>
  </g>
  <circle cx="944" cy="276" r="3.5" fill="#e8a838" fill-opacity="0.5"/>
  <text x="1136" y="281" text-anchor="end" font-family="'JetBrains Mono', SFMono-Regular, Consolas, Menlo, monospace" font-size="12" fill="#5a5550" letter-spacing="2">FULL-STACK · CLOUD</text>
</svg>
